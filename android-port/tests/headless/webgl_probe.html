<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL probe</title>
<style>html,body{margin:0;background:#020305;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="640" height="400"></canvas>
<pre id="cl-error-log" style="display:none">[]</pre>
<script>
(function () {
  var errs = [];
  window.onerror = function (m) { errs.push(String(m)); };
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2');
  if (!gl) {
    errs.push('no webgl2 context');
    document.getElementById('cl-error-log').textContent = JSON.stringify(errs);
    return;
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.05, 0.15, 0.08, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  var vs = '#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
  var fs = '#version 300 es\nprecision highp float; out vec4 o; void main(){ o = vec4(0.2,0.9,0.9,1.); }';
  function sh(t, s) { var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) errs.push(gl.getShaderInfoLog(x)); return x; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  gl.useProgram(pr);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.6,-0.6, 0.6,-0.6, 0.0,0.7]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  var px = new Uint8Array(4);
  gl.readPixels(320, 200, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  if (px[1] < 100) errs.push('pixel check failed: ' + px.join(','));
  document.getElementById('cl-error-log').textContent = JSON.stringify(errs);
  document.title = 'probe ok';
})();
</script>
</body>
</html>
